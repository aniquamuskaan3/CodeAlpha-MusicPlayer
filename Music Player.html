<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>God Mode Music Player</title>

<style>
body{
    margin:0;
    font-family:Arial;
    height:100vh;
    display:flex;
    background: radial-gradient(circle at top,#1b1b2f,#0f0f1a);
    overflow:hidden;
    color:white;
}

/* LEFT PANEL */
.left{
    flex:2;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* CARD */
.card{
    width:380px;
    padding:20px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    box-shadow:0 0 40px rgba(0,255,200,0.15);
    text-align:center;
    
}

h2{margin:10px 0 5px;}
p{color:#aaa;margin:0;}

/* BUTTONS */
button{
    background:#2c2c44;
    border:none;
    padding:10px 14px;
    margin:8px;
    border-radius:10px;
    color:white;
    cursor:pointer;
    font-size:18px;
}
button:hover{background:#00ffc3;color:black;}

input[type=range]{width:100%;margin-top:10px;}

/* PLAYLIST */
.right{
    flex:1;
    background:#121225;
    padding:15px;
    overflow-y:auto;
}

.song{
    padding:10px;
    margin:8px 0;
    background:#1f1f35;
    border-radius:10px;
    cursor:pointer;
}
.song:hover{background:#00ffc3;color:black;}
.active{background:#00ffc3 !important;color:black;}

/* VISUALIZER */
canvas{
    width:100%;
    height:60px;
    margin-top:10px;
}

/* UPLOAD */
.upload{
    margin-top:10px;
}
/* DYNAMIC GOD MODE BACKGROUND */

body.playing{
    animation: godModeBG 12s ease infinite;
    background-size: 400% 400%;
}

@keyframes godModeBG{
    0%{
        background:
        linear-gradient(-45deg,#f200ff6d,#1b1b2f,#ccff0061,#0f0f1a);
    }

    25%{
        background:
        linear-gradient(-45deg,#ffae005d,#00ffd56b,#8a5fffbc,#00ff889b);
    }

    50%{
        background:
        linear-gradient(-45deg,#00c3ff60,#ff005d44,#7928ca,#2af59a9f);
    }

    75%{
        background:
        linear-gradient(-45deg,#ff522fc9,#dd24777f,#24c7dc81,#514a9d);
    }

    100%{
        background:
        linear-gradient(-45deg,#00ffc38b,#1b1b2f,#ff0044c4,#0f0f1a);
    }
}



/* Glow Effect */
.card{
    transition:0.5s;
}

body.playing .card{
    box-shadow:
    0 0 20px #00ffc3,
    0 0 50px #00ffc3,
    0 0 100px rgba(0,255,195,.4);
}

</style>
</head>

<body>

<div class="left">
<div class="card">

    <h2 id="title">God Mode Player</h2>
    <p id="artist">Ready</p>

    <audio id="audio"></audio>

    <input type="range" id="seek" value="0">

    <div>
        <button onclick="prev()">⏮</button>
        <button onclick="toggle()">▶️</button>
        <button onclick="next()">⏭</button>
    </div>

    🔊 Volume
    <input type="range" id="volume" min="0" max="1" step="0.1">

    <div class="upload">
        🎵 Upload Song:
        <input type="file" id="file" accept="audio/*">
    </div>

    <canvas id="viz"></canvas>
    

</div>
</div>

<div class="right" id="list"></div>



<script>

const songs = [
{t:"Midnight Drive",a:"Mood Mix",s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"},
{t:"City Lights",a:"Chill",s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"},
{t:"Rain Feel",a:"Lo-fi",s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"},
{t:"Night Walk",a:"Vibes",s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"},
{t:"Dream Mode",a:"Relax",s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"},
{t:"Sky High",a:"Energy",s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"},
{t:"Lost Memory",a:"Emotional",s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3"},
{t:"Road Trip",a:"Travel",s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"},
{t:"Sunset",a:"Calm",s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3"},
{t:"Final Mode",a:"End",s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3"}
];

let i=0;
const audio=document.getElementById("audio");
const title=document.getElementById("title");
const artist=document.getElementById("artist");
const seek=document.getElementById("seek");
const volume=document.getElementById("volume");
const list=document.getElementById("list");

/* LOAD SONG */
function load(x){
    i=x;
    audio.src=songs[i].s;
    title.innerText=songs[i].t;
    artist.innerText=songs[i].a;
    highlight();
}

/* PLAY/PAUSE */
function toggle(){
    audio.paused ? audio.play() : audio.pause();
}

/* NEXT/PREV */
function next(){ load((i+1)%songs.length); audio.play(); }
function prev(){ load((i-1+songs.length)%songs.length); audio.play(); }

/* SEEK */
audio.addEventListener("timeupdate",()=>{
    seek.value=(audio.currentTime/audio.duration)*100;
});

seek.oninput=()=>{
    audio.currentTime=(seek.value/100)*audio.duration;
};

/* VOLUME */
volume.oninput=()=>audio.volume=volume.value;

/* AUTO NEXT */
audio.addEventListener("ended",next);

/* PLAYLIST */
songs.forEach((s,idx)=>{
    let d=document.createElement("div");
    d.className="song";
    d.innerText="🎵 "+s.t;
    d.onclick=()=>{load(idx);audio.play();};
    list.appendChild(d);
});

function highlight(){
    document.querySelectorAll(".song").forEach((e,idx)=>{
        e.classList.toggle("active",idx===i);
    });
}

/* FILE UPLOAD */
document.getElementById("file").onchange=(e)=>{
    let file=e.target.files[0];
    let url=URL.createObjectURL(file);
    songs.push({t:file.name,a:"Local File",s:url});
    load(songs.length-1);
    audio.play();

    let d=document.createElement("div");
    d.className="song";
    d.innerText="🎵 "+file.name;
    d.onclick=()=>{load(songs.length-1);audio.play();};
    list.appendChild(d);
};

/* SIMPLE VISUALIZER */
const canvas=document.getElementById("viz");
const ctx=canvas.getContext("2d");

function draw(){
    requestAnimationFrame(draw);
    if(audio.paused) return;

    let bars=20;
    canvas.width=300;
    canvas.height=60;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    for(let i=0;i<bars;i++){
        let h=Math.random()*50;
        ctx.fillStyle="#00ffc3";
        ctx.fillRect(i*15,60-h,10,h);
    }
}
draw();

/* KEYBOARD CONTROLS */
document.addEventListener("keydown",(e)=>{
    if(e.code==="Space"){e.preventDefault();toggle();}
    if(e.key==="ArrowRight") next();
    if(e.key==="ArrowLeft") prev();
});

/* INIT */
load(0);

/* GOD MODE COLOR EFFECT */

audio.addEventListener("play",()=>{
    document.body.classList.add("playing");
});

audio.addEventListener("pause",()=>{
    document.body.classList.remove("playing");
});

audio.addEventListener("ended",()=>{
    document.body.classList.remove("playing");
});

</script>

</body>
</html>
